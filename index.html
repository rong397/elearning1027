<!DOCTYPE html>
<!-- BUILD: AR-V6-FINAL-STABLE-20261028 -->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>沉水性植物 AR 觀察</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 0 !important;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    a-scene canvas, .a-canvas {
      background: transparent !important;
      touch-action: none !important;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 30000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: #edf5f1;
      text-align: center;
    }

    #startScreen h1 {
      margin: 0 0 8px;
      color: #20483c;
      font-size: 27px;
    }

    #version {
      margin-bottom: 14px;
      color: #176b57;
      font-size: 13px;
      font-weight: 700;
    }

    #startScreen p {
      max-width: 440px;
      margin: 0 0 24px;
      color: #50665e;
      font-size: 16px;
      line-height: 1.7;
    }

    #startButton {
      min-width: 210px;
      min-height: 50px;
      padding: 14px 28px;
      border: 0;
      border-radius: 14px;
      background: #176b57;
      color: white;
      font-size: 18px;
      font-weight: 700;
      -webkit-appearance: none;
      appearance: none;
    }

    #startButton:disabled { opacity: .55; }

    #errorMessage {
      display: none;
      width: 100%;
      max-width: 450px;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #fff0f0;
      color: #8b2929;
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
    }

    #statusBox {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 560px;
      padding: 11px 15px;
      z-index: 20000;
      display: none;
      border-radius: 14px;
      background: rgba(15,55,46,.90);
      color: #fff;
      text-align: center;
      font-size: 15px;
      line-height: 1.45;
      pointer-events: none;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    #gestureHint {
      position: fixed;
      top: calc(76px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 19000;
      display: none;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.58);
      color: white;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }

    #controlPanel {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 540px;
      padding: 14px 16px;
      z-index: 20000;
      display: none;
      border-radius: 18px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 4px 20px rgba(0,0,0,.24);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      touch-action: auto;
    }

    .controlTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }

    .controlTitle {
      min-width: 0;
      color: #20483c;
      font-size: 17px;
      font-weight: 700;
    }

    #flowValue {
      display: inline-block;
      margin-left: 6px;
      padding: 4px 9px;
      border-radius: 18px;
      background: #e1f1e9;
      color: #176b57;
      font-size: 14px;
    }

    #resetButton {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid #a9cbbd;
      border-radius: 12px;
      background: #fff;
      color: #176b57;
      font-size: 14px;
      font-weight: 700;
      -webkit-appearance: none;
      appearance: none;
    }

    #flowSlider {
      width: 100%;
      min-height: 40px;
      margin: 0;
      accent-color: #16825f;
      touch-action: auto;
    }

    .flowLabels {
      display: flex;
      justify-content: space-between;
      color: #65766f;
      font-size: 12px;
    }

    .hint {
      margin-top: 8px;
      color: #556a61;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>

<body>

  <div id="startScreen">
    <h1>沉水性植物 AR 觀察</h1>
    <div id="version">AR-V6 最終穩定版</div>
    <p>
      點擊「開始 AR」並允許相機權限，再將鏡頭對準沉水性植物圖卡。
      辨識後可旋轉、縮放模型並調整水流強度。
    </p>
    <button id="startButton" type="button" disabled>正在載入 3D 模型…</button>
    <div id="errorMessage"></div>
  </div>

  <div id="statusBox">正在啟動 AR……</div>
  <div id="gestureHint">單指拖曳旋轉｜雙指縮放</div>

  <div id="controlPanel">
    <div class="controlTop">
      <div class="controlTitle">
        🌊 水流強度
        <span id="flowValue">中等</span>
      </div>
      <button id="resetButton" type="button">↺ 重設視角</button>
    </div>

    <input id="flowSlider" type="range" min="0" max="100" value="40" step="1" aria-label="水流強度">

    <div class="flowLabels">
      <span>無水流</span>
      <span>中等</span>
      <span>強水流</span>
    </div>

    <div class="hint">
      模型區單指拖曳可旋轉，雙指可放大或縮小；滑桿可改變水流強度。
    </div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      filterMinCF: 0.001;
      filterBeta: 10;
      warmupTolerance: 5;
      missTolerance: 5;
    "
    embedded
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets timeout="30000">
      <a-asset-item
        id="plantModel"
        src="./submerged_plant_tank_final.glb?v=6"
        crossorigin="anonymous"
      ></a-asset-item>
    </a-assets>

    <!-- 確保 GLB 材質在手機上有足夠照明 -->
    <a-light type="ambient" intensity="1.25"></a-light>
    <a-light type="directional" intensity="0.75" position="1 2 2"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!--
        固定使用先前已證明能顯示模型的位置與尺寸。
        不做任何自動包圍盒、重新置中或自動縮放。
      -->
      <a-entity
        id="modelPivot"
        position="0 0 0.12"
        rotation="0 0 0"
        scale="0.18 0.18 0.18"
      >
        <a-gltf-model
          id="tankModel"
          src="#plantModel"
          position="0 0 0"
          rotation="0 0 0"
          scale="1 1 1"
        ></a-gltf-model>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const scene = document.querySelector("#arScene");
      const target = document.querySelector("#target");
      const modelEl = document.querySelector("#tankModel");
      const pivot = document.querySelector("#modelPivot");

      const startScreen = document.querySelector("#startScreen");
      const startButton = document.querySelector("#startButton");
      const errorMessage = document.querySelector("#errorMessage");
      const statusBox = document.querySelector("#statusBox");
      const gestureHint = document.querySelector("#gestureHint");

      const controlPanel = document.querySelector("#controlPanel");
      const flowSlider = document.querySelector("#flowSlider");
      const flowValue = document.querySelector("#flowValue");
      const resetButton = document.querySelector("#resetButton");

      const BASE_SCALE = 0.18;
      const BASE_Z = 0.12;

      let arSystem = null;
      let modelReady = false;
      let targetVisible = false;

      let yaw = 0;
      let pitch = 0;
      let zoom = 1;

      let lastX = 0;
      let lastY = 0;
      let pinchStartDistance = 0;
      let pinchStartZoom = 1;

      let stemRigs = [];
      let flowStrength = 40;
      let animationFrame = 0;
      const animationStart = performance.now();

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = "block";
      }

      function hideError() {
        errorMessage.style.display = "none";
      }

      function applyView() {
        pivot.object3D.position.set(0, 0, BASE_Z);

        pivot.object3D.rotation.set(
          THREE.MathUtils.degToRad(pitch),
          THREE.MathUtils.degToRad(yaw),
          0
        );

        const s = BASE_SCALE * zoom;
        pivot.object3D.scale.set(s, s, s);
      }

      function resetView() {
        yaw = 0;
        pitch = 0;
        zoom = 1;
        applyView();
      }

      function touchDistance(a, b) {
        return Math.hypot(
          a.clientX - b.clientX,
          a.clientY - b.clientY
        );
      }

      function isControl(targetElement) {
        return Boolean(
          targetElement &&
          targetElement.closest &&
          targetElement.closest("#controlPanel, #startScreen, button, input")
        );
      }

      scene.addEventListener("loaded", () => {
        arSystem = scene.systems["mindar-image-system"];
      });

      /*
        只做安全的模型清理。
        不移動、不重新置中、不改模型總尺寸。
      */
      function prepareVisibleModel() {
        const root = modelEl.getObject3D("mesh");
        if (!root) return;

        stemRigs = [];

        root.traverse((object) => {
          const name = (object.name || "").toLowerCase();

          /* Blender 預設殘留 Cube 不參與 AR */
          if (name === "cube") {
            object.visible = false;
            return;
          }

          /*
            WaterBody 就是之前正面看到的大片灰色水面。
            AR 中直接隱藏，讓學生能清楚看植物。
          */
          if (
            name === "waterbody" ||
            name.includes("waterbody")
          ) {
            object.visible = false;
            return;
          }

          if (
            object.name.startsWith("StemRig_") ||
            object.name.startsWith("YoungStemRig_")
          ) {
            stemRigs.push({
              object,
              baseX: object.rotation.x,
              baseY: object.rotation.y,
              baseZ: object.rotation.z,
              phase: Math.random() * Math.PI * 2,
              swayFactor: 0.8 + Math.random() * 0.45
            });
          }

          /*
            玻璃保留，但強制半透明，避免遮住綠色植物。
          */
          if (
            object.isMesh &&
            name.includes("glass")
          ) {
            const sourceMaterials =
              Array.isArray(object.material)
                ? object.material
                : [object.material];

            const materials = sourceMaterials.map((source) => {
              const mat = source.clone();
              mat.transparent = true;
              mat.opacity = 0.16;
              mat.depthWrite = false;
              mat.side = THREE.DoubleSide;
              mat.needsUpdate = true;
              return mat;
            });

            object.material =
              Array.isArray(object.material)
                ? materials
                : materials[0];
          }
        });

        resetView();

        console.log("AR V6 model loaded");
        console.log("StemRig count:", stemRigs.length);
      }

      modelEl.addEventListener("model-loaded", () => {
        modelReady = true;
        prepareVisibleModel();
        startPlantAnimation();

        startButton.disabled = false;
        startButton.textContent = "開始 AR";
      });

      modelEl.addEventListener("model-error", (event) => {
        console.error("model-error", event);
        startButton.disabled = true;
        startButton.textContent = "3D 模型載入失敗";
        showError("3D 模型無法載入，請重新整理頁面再試。");
      });

      startButton.addEventListener("click", () => {
        hideError();
        startButton.disabled = true;
        startButton.textContent = "正在啟動相機…";

        if (!arSystem) {
          arSystem = scene.systems["mindar-image-system"];
        }

        if (!arSystem) {
          startButton.disabled = false;
          startButton.textContent = "重新嘗試";
          showError("AR 系統尚未初始化完成，請重新整理後再試。");
          return;
        }

        statusBox.style.display = "block";
        statusBox.textContent = "正在啟動相機……";

        try {
          arSystem.start();
        } catch (error) {
          console.error(error);
          startButton.disabled = false;
          startButton.textContent = "重新嘗試";
          showError("AR 啟動失敗：" + (error.message || "未知錯誤"));
        }
      });

      scene.addEventListener("arReady", () => {
        forceCameraVideoVisible();

        startScreen.style.display = "none";
        statusBox.style.display = "block";
        statusBox.textContent = "相機已啟動！請將鏡頭對準完整圖卡。";
      });

      scene.addEventListener("arError", (event) => {
        console.error("arError", event);

        startScreen.style.display = "flex";
        startButton.disabled = false;
        startButton.textContent = "重新嘗試";
        statusBox.style.display = "none";

        showError("AR 相機無法初始化，請重新整理頁面後再試。");
      });

      /* 保留目前已在 iPhone 成功的相機顯示處理 */
      function forceCameraVideoVisible() {
        let tries = 0;

        const timer = setInterval(() => {
          tries += 1;

          document.querySelectorAll("video").forEach((video) => {
            video.setAttribute("playsinline", "");
            video.setAttribute("webkit-playsinline", "");
            video.setAttribute("autoplay", "");
            video.muted = true;

            video.style.position = "fixed";
            video.style.inset = "0";
            video.style.width = "100vw";
            video.style.height = "100vh";
            video.style.objectFit = "cover";
            video.style.display = "block";
            video.style.visibility = "visible";
            video.style.opacity = "1";
            video.style.zIndex = "0";

            const p = video.play();
            if (p && typeof p.catch === "function") {
              p.catch(() => {});
            }
          });

          if (tries >= 20) clearInterval(timer);
        }, 250);
      }

      target.addEventListener("targetFound", () => {
        targetVisible = true;

        statusBox.textContent =
          "✅ 已辨識圖卡！可旋轉、縮放模型並調整水流。";

        if (modelReady) {
          controlPanel.style.display = "block";
          gestureHint.style.display = "block";
        }

        /* 每次重新辨識都確保模型可見 */
        pivot.object3D.visible = true;
        modelEl.object3D.visible = true;
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;
        statusBox.textContent = "請將鏡頭重新對準完整圖卡。";
        controlPanel.style.display = "none";
        gestureHint.style.display = "none";
      });

      /* -----------------------------
         手機：單指旋轉、雙指縮放
      ----------------------------- */

      document.addEventListener("touchstart", (event) => {
        if (!targetVisible || isControl(event.target)) return;

        if (event.touches.length === 1) {
          lastX = event.touches[0].clientX;
          lastY = event.touches[0].clientY;
        } else if (event.touches.length === 2) {
          pinchStartDistance =
            touchDistance(event.touches[0], event.touches[1]);
          pinchStartZoom = zoom;
        }
      }, { passive: false });

      document.addEventListener("touchmove", (event) => {
        if (!targetVisible || isControl(event.target)) return;

        if (event.touches.length === 1) {
          event.preventDefault();

          const x = event.touches[0].clientX;
          const y = event.touches[0].clientY;

          yaw += (x - lastX) * 0.38;
          pitch = clamp(
            pitch + (y - lastY) * 0.25,
            -40,
            40
          );

          lastX = x;
          lastY = y;
          applyView();

        } else if (
          event.touches.length === 2 &&
          pinchStartDistance > 0
        ) {
          event.preventDefault();

          const distance =
            touchDistance(event.touches[0], event.touches[1]);

          zoom = clamp(
            pinchStartZoom *
            (distance / pinchStartDistance),
            0.60,
            1.80
          );

          applyView();
        }
      }, { passive: false });

      document.addEventListener("touchend", () => {
        pinchStartDistance = 0;
      }, { passive: true });

      resetButton.addEventListener("click", resetView);

      /* -----------------------------
         水流
      ----------------------------- */

      flowSlider.addEventListener("input", (event) => {
        flowStrength = Number(event.target.value);
        updateFlowLabel();
      });

      function updateFlowLabel() {
        if (flowStrength === 0) {
          flowValue.textContent = "無水流";
        } else if (flowStrength < 35) {
          flowValue.textContent = "微弱";
        } else if (flowStrength < 70) {
          flowValue.textContent = "中等";
        } else {
          flowValue.textContent = "強";
        }
      }

      function startPlantAnimation() {
        if (animationFrame) cancelAnimationFrame(animationFrame);

        function animate(now) {
          const t = (now - animationStart) / 1000;
          const strength = flowStrength / 100;

          const tilt =
            strength * THREE.MathUtils.degToRad(15);

          const sway =
            strength * THREE.MathUtils.degToRad(7);

          stemRigs.forEach((stem) => {
            const wave = Math.sin(
              t * (1.1 + strength * 1.5) +
              stem.phase
            );

            stem.object.rotation.z =
              stem.baseZ -
              tilt * stem.swayFactor +
              wave * sway * stem.swayFactor;

            stem.object.rotation.x =
              stem.baseX +
              wave * sway * 0.28;
          });

          animationFrame = requestAnimationFrame(animate);
        }

        animationFrame = requestAnimationFrame(animate);
      }

      updateFlowLabel();
      resetView();
    });
  </script>
</body>
</html>
