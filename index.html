<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  >

  <title>沉水性植物 AR 觀察</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!--
    改用 MindAR 1.2.3
    避開目前部分新版 iOS 與 1.2.5 的 WebGL 相容性問題
  -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family:
        "PingFang TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
    }


    /* =====================================================
       重要：
       強制讓手機相機畫面位於最底層並顯示
       ===================================================== */

    video {
      position: fixed !important;

      top: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      object-fit: cover !important;

      display: block !important;

      z-index: 0 !important;

      background: #000;
    }


    /* A-Frame 放在相機上面 */
    a-scene {
      position: fixed !important;

      top: 0;
      left: 0;

      width: 100vw !important;
      height: 100vh !important;

      z-index: 1;

      background: transparent !important;
    }


    /* 3D Canvas 必須透明，否則會把相機蓋成黑色 */
    a-scene canvas,
    .a-canvas {
      background: transparent !important;
    }


    /* =====================================================
       開始畫面
       ===================================================== */

    #startScreen {
      position: fixed;

      inset: 0;

      z-index: 30000;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #edf5f1;

      text-align: center;
    }


    #startScreen h1 {
      margin: 0 0 16px;

      color: #20483c;

      font-size: 27px;
    }


    #startScreen p {
      max-width: 440px;

      margin: 0 0 25px;

      color: #50665e;

      font-size: 16px;

      line-height: 1.7;
    }


    #startButton {
      min-width: 210px;

      padding: 15px 30px;

      border: none;
      border-radius: 14px;

      background: #176b57;

      color: #fff;

      font-size: 18px;
      font-weight: 700;

      cursor: pointer;

      -webkit-appearance: none;
      appearance: none;
    }


    #startButton:disabled {
      opacity: 0.55;
    }


    #errorMessage {
      display: none;

      width: 100%;
      max-width: 450px;

      margin-top: 20px;

      padding: 14px 16px;

      border-radius: 12px;

      background: #fff0f0;

      color: #8b2929;

      font-size: 14px;

      line-height: 1.6;

      text-align: left;
    }


    /* =====================================================
       上方狀態
       ===================================================== */

    #statusBox {
      position: fixed;

      top:
        calc(
          14px +
          env(safe-area-inset-top)
        );

      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 32px);
      max-width: 520px;

      padding: 12px 16px;

      z-index: 20000;

      display: none;

      border-radius: 14px;

      background:
        rgba(15, 55, 46, 0.9);

      color: #fff;

      text-align: center;

      font-size: 15px;

      line-height: 1.5;

      pointer-events: none;
    }


    /* =====================================================
       水流控制
       ===================================================== */

    #controlPanel {
      position: fixed;

      left: 50%;

      bottom:
        calc(
          18px +
          env(safe-area-inset-bottom)
        );

      transform: translateX(-50%);

      width: calc(100% - 30px);
      max-width: 520px;

      padding: 15px 18px;

      z-index: 20000;

      display: none;

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.95);

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.25);
    }


    .controlTitle {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 9px;

      color: #20483c;

      font-size: 17px;
      font-weight: 700;
    }


    #flowValue {
      padding: 4px 10px;

      border-radius: 20px;

      background: #e1f1e9;

      color: #176b57;

      font-size: 14px;
    }


    #flowSlider {
      width: 100%;

      height: 34px;

      accent-color: #16825f;
    }


    .flowLabels {
      display: flex;

      justify-content: space-between;

      color: #65766f;

      font-size: 12px;
    }


    .hint {
      margin-top: 8px;

      color: #556a61;

      font-size: 13px;

      line-height: 1.45;
    }

  </style>

</head>


<body>


  <!-- =====================================================
       開始畫面
       ===================================================== -->

  <div id="startScreen">

    <h1>
      沉水性植物 AR 觀察
    </h1>

    <p>
      點擊「開始 AR」後，請允許瀏覽器使用相機。
      接著將鏡頭對準指定的沉水性植物完整圖卡。
    </p>

    <button
      id="startButton"
      disabled
    >
      正在載入 3D 模型…
    </button>

    <div id="errorMessage"></div>

  </div>



  <!-- =====================================================
       狀態提示
       ===================================================== -->

  <div id="statusBox">
    正在啟動 AR……
  </div>



  <!-- =====================================================
       水流控制
       ===================================================== -->

  <div id="controlPanel">

    <div class="controlTitle">

      <span>
        🌊 水流強度
      </span>

      <span id="flowValue">
        中等
      </span>

    </div>


    <input
      id="flowSlider"
      type="range"
      min="0"
      max="100"
      value="35"
      step="1"
    >


    <div class="flowLabels">

      <span>無水流</span>

      <span>中等</span>

      <span>強水流</span>

    </div>


    <div class="hint">
      拖動滑桿，觀察水流增強時，
      沉水性植物的莖與葉如何隨水流擺動。
    </div>

  </div>



  <!-- =====================================================
       AR Scene
       ===================================================== -->

  <a-scene

    id="arScene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      filterMinCF: 0.001;
      filterBeta: 10;
      warmupTolerance: 5;
      missTolerance: 5;
    "

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >


    <!-- =============================
         Assets
         ============================= -->

    <a-assets timeout="30000">

      <a-asset-item
        id="plantModel"
        src="./submerged_plant_tank_final.glb"
        crossorigin="anonymous"
      >
      </a-asset-item>

    </a-assets>



    <!-- =============================
         Camera
         ============================= -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

      cursor="
        fuse: false;
        rayOrigin: mouse;
      "

    >
    </a-camera>



    <!-- =============================
         Image Target
         ============================= -->

    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0;
      "

    >

      <a-gltf-model

        id="tankModel"

        src="#plantModel"

        position="0 0 0.12"

        rotation="90 0 0"

        scale="0.18 0.18 0.18"

      >
      </a-gltf-model>

    </a-entity>


  </a-scene>



  <script>

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const scene =
          document.querySelector(
            "#arScene"
          );

        const target =
          document.querySelector(
            "#target"
          );

        const modelEl =
          document.querySelector(
            "#tankModel"
          );

        const startScreen =
          document.querySelector(
            "#startScreen"
          );

        const startButton =
          document.querySelector(
            "#startButton"
          );

        const errorMessage =
          document.querySelector(
            "#errorMessage"
          );

        const statusBox =
          document.querySelector(
            "#statusBox"
          );

        const controlPanel =
          document.querySelector(
            "#controlPanel"
          );

        const flowSlider =
          document.querySelector(
            "#flowSlider"
          );

        const flowValue =
          document.querySelector(
            "#flowValue"
          );


        let arSystem = null;

        let modelReady = false;

        let arReady = false;

        let stemRigs = [];

        let flowStrength = 35;

        let animationFrame = null;

        const animationStart =
          performance.now();



        /* =================================================
           Scene 初始化
           ================================================= */

        scene.addEventListener(
          "loaded",
          () => {

            arSystem =
              scene.systems[
                "mindar-image-system"
              ];

          }
        );



        /* =================================================
           GLB 載入成功
           ================================================= */

        modelEl.addEventListener(
          "model-loaded",
          () => {

            modelReady = true;

            collectStemRigs();

            startPlantAnimation();

            startButton.disabled =
              false;

            startButton.textContent =
              "開始 AR";

          }
        );



        /* =================================================
           GLB 載入失敗
           ================================================= */

        modelEl.addEventListener(
          "model-error",
          event => {

            console.error(
              "GLB model error:",
              event
            );

            startButton.disabled =
              true;

            startButton.textContent =
              "3D 模型載入失敗";

            showError(
              "3D 模型無法載入。請確認 submerged_plant_tank_final.glb、targets.mind 與 index.html 都位於 GitHub Repository 的同一層。"
            );

          }
        );



        /* =================================================
           開始 AR
           ================================================= */

        startButton.addEventListener(
          "click",
          () => {

            errorMessage.style.display =
              "none";

            startButton.disabled =
              true;

            startButton.textContent =
              "正在啟動相機…";


            if (!arSystem) {

              arSystem =
                scene.systems[
                  "mindar-image-system"
                ];

            }


            if (!arSystem) {

              startButton.disabled =
                false;

              startButton.textContent =
                "重新嘗試";

              showError(
                "MindAR 尚未初始化完成。請重新整理頁面後再試。"
              );

              return;

            }


            statusBox.style.display =
              "block";

            statusBox.textContent =
              "正在啟動相機……";


            /*
             * 使用 MindAR 官方 API
             * 不自行重複呼叫 getUserMedia
             */
            try {

              arSystem.start();

            }

            catch (error) {

              console.error(
                "MindAR start error:",
                error
              );

              startButton.disabled =
                false;

              startButton.textContent =
                "重新嘗試";

              showError(
                "AR 啟動失敗：" +
                (
                  error.message ||
                  "未知錯誤"
                )
              );

            }


            /*
             * 如果 MindAR 沒有送出 arReady，
             * 不讓使用者只看到無限黑畫面。
             */
            setTimeout(
              () => {

                if (!arReady) {

                  startButton.disabled =
                    false;

                  startButton.textContent =
                    "重新嘗試";

                  startScreen.style.display =
                    "flex";

                  statusBox.style.display =
                    "none";

                  showError(
                    "相機權限已取得，但 AR 引擎沒有成功啟動。如果你使用新版 iOS，這可能是 MindAR 與 WebGL 的相容性問題。可先重新整理一次頁面；若仍失敗，請改用 Android Chrome 或其他 iPhone/iPad 測試。"
                  );

                }

              },
              10000
            );

          }
        );



        /* =================================================
           MindAR 已準備完成
           ================================================= */

        scene.addEventListener(
          "arReady",
          () => {

            arReady = true;

            forceCameraVideoVisible();

            startScreen.style.display =
              "none";

            statusBox.style.display =
              "block";

            statusBox.textContent =
              "相機已啟動！請將鏡頭對準完整圖卡。";

          }
        );



        /* =================================================
           MindAR 啟動錯誤
           ================================================= */

        scene.addEventListener(
          "arError",
          event => {

            console.error(
              "MindAR arError:",
              event
            );

            arReady = false;

            startScreen.style.display =
              "flex";

            startButton.disabled =
              false;

            startButton.textContent =
              "重新嘗試";

            statusBox.style.display =
              "none";


            showError(
              "相機權限已允許，但 MindAR 無法完成 AR 初始化。這通常不是模型問題，而是瀏覽器／WebGL 相容性問題。"
            );

          }
        );



        /* =================================================
           強制修正 iPhone 相機 video 顯示
           ================================================= */

        function forceCameraVideoVisible() {

          let attempts = 0;


          const timer =
            setInterval(
              () => {

                attempts += 1;


                const videos =
                  document.querySelectorAll(
                    "video"
                  );


                if (
                  videos.length > 0
                ) {

                  videos.forEach(
                    video => {

                      video.setAttribute(
                        "playsinline",
                        ""
                      );

                      video.setAttribute(
                        "webkit-playsinline",
                        ""
                      );

                      video.setAttribute(
                        "autoplay",
                        ""
                      );

                      video.muted =
                        true;


                      video.style.position =
                        "fixed";

                      video.style.top =
                        "0";

                      video.style.left =
                        "0";

                      video.style.width =
                        "100vw";

                      video.style.height =
                        "100vh";

                      video.style.objectFit =
                        "cover";

                      video.style.display =
                        "block";

                      video.style.visibility =
                        "visible";

                      video.style.opacity =
                        "1";

                      video.style.zIndex =
                        "0";


                      const playPromise =
                        video.play();


                      if (
                        playPromise &&
                        typeof playPromise.catch ===
                        "function"
                      ) {

                        playPromise.catch(
                          error => {

                            console.warn(
                              "Camera video play:",
                              error
                            );

                          }
                        );

                      }

                    }
                  );

                }


                /*
                 * 約數秒後停止重複設定
                 */
                if (
                  attempts >= 20
                ) {

                  clearInterval(
                    timer
                  );

                }

              },
              250
            );

        }



        /* =================================================
           找到圖卡
           ================================================= */

        target.addEventListener(
          "targetFound",
          () => {

            statusBox.textContent =
              "✅ 已辨識圖卡！請觀察沉水性植物。";


            if (modelReady) {

              controlPanel.style.display =
                "block";

            }

          }
        );



        /* =================================================
           圖卡離開鏡頭
           ================================================= */

        target.addEventListener(
          "targetLost",
          () => {

            statusBox.textContent =
              "請將鏡頭重新對準完整圖卡。";

            controlPanel.style.display =
              "none";

          }
        );



        /* =================================================
           錯誤訊息
           ================================================= */

        function showError(message) {

          errorMessage.textContent =
            message;

          errorMessage.style.display =
            "block";

        }



        /* =================================================
           尋找植物 StemRig
           ================================================= */

        function collectStemRigs() {

          const model =
            modelEl.getObject3D(
              "mesh"
            );


          if (!model) {

            return;

          }


          stemRigs = [];


          model.traverse(
            object => {

              const isStem =
                object.name.startsWith(
                  "StemRig_"
                );

              const isYoungStem =
                object.name.startsWith(
                  "YoungStemRig_"
                );


              if (
                isStem ||
                isYoungStem
              ) {

                stemRigs.push({

                  object,

                  baseX:
                    object.rotation.x,

                  baseY:
                    object.rotation.y,

                  baseZ:
                    object.rotation.z,

                  phase:
                    Math.random()
                    * Math.PI
                    * 2,

                  swayFactor:
                    0.8
                    +
                    Math.random()
                    * 0.5

                });

              }

            }
          );


          console.log(
            "Stem rigs:",
            stemRigs.length
          );

        }



        /* =================================================
           水流滑桿
           ================================================= */

        flowSlider.addEventListener(
          "input",
          event => {

            flowStrength =
              Number(
                event.target.value
              );

            updateFlowLabel();

          }
        );



        function updateFlowLabel() {

          if (
            flowStrength === 0
          ) {

            flowValue.textContent =
              "無水流";

          }

          else if (
            flowStrength < 35
          ) {

            flowValue.textContent =
              "微弱";

          }

          else if (
            flowStrength < 70
          ) {

            flowValue.textContent =
              "中等";

          }

          else {

            flowValue.textContent =
              "強";

          }

        }



        /* =================================================
           植物水流動畫
           ================================================= */

        function startPlantAnimation() {

          if (animationFrame) {

            cancelAnimationFrame(
              animationFrame
            );

          }


          function animate(now) {

            const time =
              (
                now -
                animationStart
              )
              / 1000;


            const normalized =
              flowStrength
              / 100;


            const baseTilt =
              normalized
              *
              THREE.MathUtils
                .degToRad(15);


            const swayAmount =
              normalized
              *
              THREE.MathUtils
                .degToRad(7);


            stemRigs.forEach(
              stem => {

                const wave =
                  Math.sin(

                    time
                    *
                    (
                      1.1
                      +
                      normalized
                      * 1.5
                    )

                    +

                    stem.phase

                  );


                stem.object.rotation.z =

                  stem.baseZ

                  -

                  baseTilt
                  * stem.swayFactor

                  +

                  wave
                  * swayAmount
                  * stem.swayFactor;


                stem.object.rotation.x =

                  stem.baseX

                  +

                  wave
                  * swayAmount
                  * 0.28;

              }
            );


            animationFrame =
              requestAnimationFrame(
                animate
              );

          }


          animationFrame =
            requestAnimationFrame(
              animate
            );

        }



        updateFlowLabel();

      }
    );

  </script>

</body>

</html>
