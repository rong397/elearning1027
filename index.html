<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>沉水性植物 AR 觀察</title>


  <!-- MindAR -->
  <script
    src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js">
  </script>

  <!-- A-Frame -->
  <script
    src="https://aframe.io/releases/1.5.0/aframe.min.js">
  </script>

  <!-- MindAR A-Frame -->
  <script
    src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js">
  </script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        "Microsoft JhengHei",
        "PingFang TC",
        Arial,
        sans-serif;

      background: #000;
    }


    /* ==========================================
       上方提示
       ========================================== */

    #statusBox {

      position: fixed;

      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 36px);
      max-width: 500px;

      padding: 12px 16px;

      border-radius: 14px;

      background:
        rgba(15, 55, 46, 0.88);

      color: #ffffff;

      text-align: center;

      font-size: 16px;
      line-height: 1.5;

      z-index: 10000;

      pointer-events: none;

      backdrop-filter: blur(8px);
    }


    /* ==========================================
       下方控制區
       ========================================== */

    #controlPanel {

      position: fixed;

      left: 50%;
      bottom: 22px;

      transform: translateX(-50%);

      width: calc(100% - 32px);
      max-width: 520px;

      padding: 16px 18px;

      background:
        rgba(255, 255, 255, 0.94);

      border-radius: 18px;

      z-index: 10000;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.25);

      display: none;
    }


    .controlTitle {

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 10px;

      color: #20483c;

      font-size: 17px;

      font-weight: bold;
    }


    #flowValue {

      padding: 4px 10px;

      border-radius: 20px;

      background: #e1f1e9;

      color: #176b57;

      font-size: 14px;
    }


    input[type="range"] {

      width: 100%;

      height: 34px;

      accent-color: #16825f;

      cursor: pointer;
    }


    .flowLabels {

      display: flex;

      justify-content: space-between;

      color: #61736c;

      font-size: 13px;

      margin-top: 2px;
    }


    .hint {

      margin-top: 10px;

      color: #5a6d65;

      font-size: 13px;

      line-height: 1.5;
    }


    /* ==========================================
       載入畫面
       ========================================== */

    #loading {

      position: fixed;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 14px;

      background: #edf5f1;

      color: #244238;

      z-index: 20000;
    }


    .spinner {

      width: 46px;
      height: 46px;

      border:
        5px solid #c9ddd5;

      border-top-color:
        #176b57;

      border-radius: 50%;

      animation:
        spin 0.9s linear infinite;
    }


    @keyframes spin {

      to {

        transform: rotate(360deg);

      }

    }


    #loadingText {

      font-size: 17px;

      text-align: center;

      padding: 0 20px;

      line-height: 1.6;
    }


    @media (max-width: 480px) {

      #statusBox {

        font-size: 15px;

      }


      #controlPanel {

        padding: 14px;

      }


      .controlTitle {

        font-size: 16px;

      }

    }

  </style>

</head>



<body>


  <!-- ==========================================
       載入提示
       ========================================== -->

  <div id="loading">

    <div class="spinner"></div>

    <div id="loadingText">

      正在準備 AR 模型……<br>
      第一次載入可能需要幾秒鐘。

    </div>

  </div>



  <!-- ==========================================
       上方提示
       ========================================== -->

  <div id="statusBox">

    請允許使用相機，並將鏡頭對準老師指定的完整圖卡。

  </div>



  <!-- ==========================================
       水流控制
       ========================================== -->

  <div id="controlPanel">


    <div class="controlTitle">

      <span>
        🌊 水流強度
      </span>

      <span id="flowValue">
        中等
      </span>

    </div>


    <input
      id="flowSlider"
      type="range"
      min="0"
      max="100"
      value="35"
      step="1"
      aria-label="調整水流強度"
    >


    <div class="flowLabels">

      <span>
        無水流
      </span>

      <span>
        中等
      </span>

      <span>
        強水流
      </span>

    </div>


    <div class="hint">

      拖動滑桿，觀察水流增強時，
      沉水性植物的莖與葉如何隨水流擺動。

    </div>

  </div>



  <!-- ==========================================
       MindAR Scene
       ========================================== -->

  <a-scene

    id="arScene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      filterMinCF: 0.001;
      filterBeta: 10;
      warmupTolerance: 5;
      missTolerance: 5;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded

  >



    <!-- ======================================
         模型資源
         ====================================== -->

    <a-assets
      timeout="30000"
    >


      <a-asset-item

        id="plantModel"

        src="./submerged_plant_tank_final.glb"

        crossorigin="anonymous"

      >
      </a-asset-item>


    </a-assets>



    <!-- ======================================
         AR Camera
         ====================================== -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

      cursor="rayOrigin: mouse"

    >
    </a-camera>



    <!-- ======================================
         圖片辨識 Target
         ====================================== -->

    <a-entity

      id="target"

      mindar-image-target="targetIndex: 0"

    >


      <!--
        模型大小：

        你的水槽原始寬度大約是數個 Blender Unit，
        這裡先縮到 0.18。

        如果之後 AR 中太大：
        改成 0.12

        太小：
        改成 0.22～0.25
      -->

      <a-gltf-model

        id="tankModel"

        src="#plantModel"

        position="0 0 0.12"

        rotation="90 0 0"

        scale="0.18 0.18 0.18"

      >
      </a-gltf-model>


    </a-entity>


  </a-scene>



  <script>

    // ==========================================
    // DOM
    // ==========================================

    const scene =
      document.querySelector('#arScene');

    const target =
      document.querySelector('#target');

    const modelEl =
      document.querySelector('#tankModel');

    const loading =
      document.querySelector('#loading');

    const loadingText =
      document.querySelector('#loadingText');

    const statusBox =
      document.querySelector('#statusBox');

    const controlPanel =
      document.querySelector('#controlPanel');

    const flowSlider =
      document.querySelector('#flowSlider');

    const flowValue =
      document.querySelector('#flowValue');



    // ==========================================
    // Stem Rig 資料
    // ==========================================

    let stemRigs = [];

    let flowStrength = 35;

    let animationFrame = null;

    let startTime = performance.now();

    let modelReady = false;



    // ==========================================
    // 儲存每株植物原始角度
    // ==========================================

    function collectStemRigs() {


      const model =
        modelEl.getObject3D('mesh');


      if (!model) {

        console.warn(
          '找不到 GLB 模型。'
        );

        return;

      }


      stemRigs = [];


      model.traverse(object => {


        const isMainStem =
          object.name.startsWith(
            'StemRig_'
          );


        const isYoungStem =
          object.name.startsWith(
            'YoungStemRig_'
          );


        if (
          isMainStem ||
          isYoungStem
        ) {


          stemRigs.push({

            object: object,

            baseX:
              object.rotation.x,

            baseY:
              object.rotation.y,

            baseZ:
              object.rotation.z,

            phase:
              Math.random()
              * Math.PI
              * 2,

            swayFactor:
              0.8
              +
              Math.random()
              * 0.5

          });


        }

      });


      console.log(
        '找到植物控制節點：',
        stemRigs.length
      );


    }



    // ==========================================
    // 模型載入完成
    // ==========================================

    modelEl.addEventListener(
      'model-loaded',
      () => {


        modelReady = true;


        collectStemRigs();


        loading.style.display =
          'none';


        statusBox.textContent =
          'AR 已準備完成！請將鏡頭對準完整圖卡。';


        startPlantAnimation();


      }
    );



    // ==========================================
    // 模型載入失敗
    // ==========================================

    modelEl.addEventListener(
      'model-error',
      event => {


        loadingText.innerHTML =
          '3D 模型載入失敗。<br>' +
          '請確認 submerged_plant_tank_final.glb ' +
          '已和 index.html 放在 GitHub 同一層。';


        console.error(
          'GLB model error:',
          event
        );


      }
    );



    // ==========================================
    // MindAR 找到目標
    // ==========================================

    target.addEventListener(
      'targetFound',
      () => {


        statusBox.textContent =
          '✅ 已辨識圖卡！請觀察沉水性植物。';


        if (modelReady) {

          controlPanel.style.display =
            'block';

        }


      }
    );



    // ==========================================
    // MindAR 失去目標
    // ==========================================

    target.addEventListener(
      'targetLost',
      () => {


        statusBox.textContent =
          '請將鏡頭重新對準完整圖卡。';


        controlPanel.style.display =
          'none';


      }
    );



    // ==========================================
    // 水流滑桿
    // ==========================================

    flowSlider.addEventListener(
      'input',
      event => {


        flowStrength =
          Number(
            event.target.value
          );


        updateFlowLabel();


      }
    );



    function updateFlowLabel() {


      if (flowStrength === 0) {


        flowValue.textContent =
          '無水流';


      }


      else if (
        flowStrength < 35
      ) {


        flowValue.textContent =
          '微弱';


      }


      else if (
        flowStrength < 70
      ) {


        flowValue.textContent =
          '中等';


      }


      else {


        flowValue.textContent =
          '強';


      }


    }



    // ==========================================
    // 水流動畫
    // ==========================================

    function startPlantAnimation() {


      if (animationFrame) {

        cancelAnimationFrame(
          animationFrame
        );

      }


      function animate(now) {


        const time =
          (now - startTime)
          / 1000;


        // 0 ~ 1
        const normalized =
          flowStrength
          / 100;


        /*
          最大傾斜大約 18 度。

          水流 = 0 時：
          植物回到原始位置。

          水流越大：
          整體向同方向傾斜，
          同時增加緩慢擺動。
        */

        const baseTilt =
          normalized
          * THREE.MathUtils.degToRad(
            15
          );


        const swayAmount =
          normalized
          * THREE.MathUtils.degToRad(
            7
          );


        stemRigs.forEach(
          (stem, index) => {


            const wave =

              Math.sin(

                time
                * (
                  1.1
                  +
                  normalized
                  * 1.5
                )

                +

                stem.phase

              );


            /*
              Z：
              模擬水流向側方推動。

              X：
              加入較小幅度前後擺動，
              避免全部植物同步。
            */

            stem.object.rotation.z =

              stem.baseZ

              -

              baseTilt

              * stem.swayFactor

              +

              wave

              * swayAmount

              * stem.swayFactor;


            stem.object.rotation.x =

              stem.baseX

              +

              wave

              * swayAmount

              * 0.28;


          }
        );


        animationFrame =
          requestAnimationFrame(
            animate
          );


      }


      animationFrame =
        requestAnimationFrame(
          animate
        );


    }



    // ==========================================
    // Scene 載入提示
    // ==========================================

    scene.addEventListener(
      'loaded',
      () => {


        loadingText.innerHTML =
          'AR 系統已啟動。<br>' +
          '正在載入 3D 水槽……';


      }
    );



    // ==========================================
    // 初始化
    // ==========================================

    updateFlowLabel();


  </script>


</body>

</html>
