<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>沉水性植物 AR 觀察</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- 使用目前已在 iPhone 成功啟動的 MindAR 1.2.3 -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    /* MindAR 相機影像 */
    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 0 !important;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
      background: transparent !important;
    }

    a-scene canvas,
    .a-canvas {
      background: transparent !important;
      touch-action: none;
    }

    /* 開始畫面 */
    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 30000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: #edf5f1;
      text-align: center;
    }

    #startScreen h1 {
      margin: 0 0 14px;
      color: #20483c;
      font-size: 27px;
    }

    #startScreen p {
      max-width: 440px;
      margin: 0 0 24px;
      color: #50665e;
      font-size: 16px;
      line-height: 1.7;
    }

    #startButton {
      min-width: 210px;
      min-height: 50px;
      padding: 14px 28px;
      border: 0;
      border-radius: 14px;
      background: #176b57;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      -webkit-appearance: none;
      appearance: none;
    }

    #startButton:disabled { opacity: 0.55; }

    #errorMessage {
      display: none;
      width: 100%;
      max-width: 450px;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #fff0f0;
      color: #8b2929;
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
    }

    /* 上方提示 */
    #statusBox {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 560px;
      padding: 11px 15px;
      z-index: 20000;
      display: none;
      border-radius: 14px;
      background: rgba(15, 55, 46, 0.90);
      color: #fff;
      text-align: center;
      font-size: 15px;
      line-height: 1.45;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* 操作提示 */
    #gestureHint {
      position: fixed;
      top: calc(77px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 19000;
      display: none;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 下方控制區 */
    #controlPanel {
      position: fixed;
      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 540px;
      padding: 14px 16px;
      z-index: 20000;
      display: none;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .controlTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .controlTitle {
      min-width: 0;
      color: #20483c;
      font-size: 17px;
      font-weight: 700;
    }

    #flowValue {
      display: inline-block;
      margin-left: 6px;
      padding: 4px 9px;
      border-radius: 18px;
      background: #e1f1e9;
      color: #176b57;
      font-size: 14px;
      vertical-align: middle;
    }

    #resetButton {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid #b8d2c8;
      border-radius: 11px;
      background: #fff;
      color: #176b57;
      font-size: 14px;
      font-weight: 700;
      -webkit-appearance: none;
      appearance: none;
    }

    #flowSlider {
      width: 100%;
      min-height: 36px;
      margin: 0;
      accent-color: #16825f;
    }

    .flowLabels {
      display: flex;
      justify-content: space-between;
      color: #65766f;
      font-size: 12px;
    }

    .hint {
      margin-top: 8px;
      color: #556a61;
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 380px) {
      #statusBox { font-size: 14px; }
      #gestureHint { font-size: 12px; }
      .controlTitle { font-size: 15px; }
      #resetButton { font-size: 13px; }
    }
  </style>
</head>

<body>

  <div id="startScreen">
    <h1>沉水性植物 AR 觀察</h1>
    <p>
      點擊「開始 AR」並允許相機權限，再將鏡頭對準沉水性植物圖卡。
      辨識後可用手指旋轉與縮放 3D 水槽。
    </p>

    <button id="startButton" type="button" disabled>
      正在載入 3D 模型…
    </button>

    <div id="errorMessage"></div>
  </div>

  <div id="statusBox">
    正在啟動 AR……
  </div>

  <div id="gestureHint">
    單指拖曳旋轉｜雙指縮放
  </div>

  <div id="controlPanel">
    <div class="controlTop">
      <div class="controlTitle">
        🌊 水流強度
        <span id="flowValue">中等</span>
      </div>

      <button id="resetButton" type="button">
        ↺ 重設視角
      </button>
    </div>

    <input
      id="flowSlider"
      type="range"
      min="0"
      max="100"
      value="35"
      step="1"
      aria-label="水流強度"
    >

    <div class="flowLabels">
      <span>無水流</span>
      <span>中等</span>
      <span>強水流</span>
    </div>

    <div class="hint">
      拖動滑桿觀察水流變化；在模型區單指拖曳可旋轉，雙指可放大或縮小。
    </div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      filterMinCF: 0.001;
      filterBeta: 10;
      warmupTolerance: 5;
      missTolerance: 5;
    "
    embedded
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets timeout="30000">
      <a-asset-item
        id="plantModel"
        src="./submerged_plant_tank_final.glb"
        crossorigin="anonymous"
      ></a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <!--
        Pivot 專門負責學生手勢旋轉／縮放。
        模型本身維持 rotation 0 0 0，避免水槽底面朝向相機。
      -->
      <a-entity
        id="modelPivot"
        position="0 0 0.08"
        rotation="-10 18 0"
        scale="1 1 1"
      >
        <a-gltf-model
          id="tankModel"
          src="#plantModel"
          position="0 0 0"
          rotation="0 0 0"
          scale="1 1 1"
        ></a-gltf-model>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const scene = document.querySelector("#arScene");
      const target = document.querySelector("#target");
      const modelEl = document.querySelector("#tankModel");
      const modelPivot = document.querySelector("#modelPivot");

      const startScreen = document.querySelector("#startScreen");
      const startButton = document.querySelector("#startButton");
      const errorMessage = document.querySelector("#errorMessage");
      const statusBox = document.querySelector("#statusBox");
      const gestureHint = document.querySelector("#gestureHint");

      const controlPanel = document.querySelector("#controlPanel");
      const flowSlider = document.querySelector("#flowSlider");
      const flowValue = document.querySelector("#flowValue");
      const resetButton = document.querySelector("#resetButton");

      let arSystem = null;
      let arReady = false;
      let modelReady = false;
      let targetVisible = false;

      let stemRigs = [];
      let flowStrength = 35;
      let animationFrame = null;
      const animationStart = performance.now();

      /* 學生操作狀態 */
      const DEFAULT_PITCH = -10;
      const DEFAULT_YAW = 18;

      let pitch = DEFAULT_PITCH;
      let yaw = DEFAULT_YAW;
      let userScale = 1;

      let lastTouchX = 0;
      let lastTouchY = 0;
      let lastPinchDistance = 0;
      let pinchStartScale = 1;

      /* ------------------------------
         共用工具
      ------------------------------ */

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = "block";
      }

      function hideError() {
        errorMessage.style.display = "none";
      }

      function setPivotTransform() {
        modelPivot.object3D.rotation.set(
          THREE.MathUtils.degToRad(pitch),
          THREE.MathUtils.degToRad(yaw),
          0
        );

        modelPivot.object3D.scale.setScalar(userScale);
      }

      function resetView() {
        pitch = DEFAULT_PITCH;
        yaw = DEFAULT_YAW;
        userScale = 1;
        setPivotTransform();
      }

      function touchDistance(t1, t2) {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.hypot(dx, dy);
      }

      function isUIElement(element) {
        if (!element || !element.closest) return false;

        return Boolean(
          element.closest(
            "#controlPanel, #startScreen, button, input"
          )
        );
      }

      /* ------------------------------
         Scene 初始化
      ------------------------------ */

      scene.addEventListener("loaded", () => {
        arSystem = scene.systems["mindar-image-system"];
      });

      /* ------------------------------
         模型處理
      ------------------------------ */

      function prepareModel() {
        const root = modelEl.getObject3D("mesh");

        if (!root) return;

        stemRigs = [];

        /*
          1. 隱藏 Blender 預設／舊模型可能殘留的 Cube
          2. 讓玻璃和水體不再遮住植物
          3. 找出水草 StemRig
        */
        root.traverse((object) => {

          const objectName = (object.name || "").toLowerCase();

          if (objectName === "cube") {
            object.visible = false;
            return;
          }

          if (
            object.name.startsWith("StemRig_") ||
            object.name.startsWith("YoungStemRig_")
          ) {
            stemRigs.push({
              object,
              baseX: object.rotation.x,
              baseY: object.rotation.y,
              baseZ: object.rotation.z,
              phase: Math.random() * Math.PI * 2,
              swayFactor: 0.8 + Math.random() * 0.5
            });
          }

          if (!object.isMesh || !object.material) return;

          const materials = Array.isArray(object.material)
            ? object.material
            : [object.material];

          const fixedMaterials = materials.map((originalMaterial) => {

            const material = originalMaterial.clone();

            const materialName =
              (material.name || "").toLowerCase();

            const tag =
              `${objectName} ${materialName}`;

            if (
              tag.includes("glass") ||
              tag.includes("glasswall")
            ) {
              material.transparent = true;
              material.opacity = 0.16;
              material.depthWrite = false;
              material.side = THREE.DoubleSide;
              material.needsUpdate = true;
            }

            if (
              tag.includes("waterbody") ||
              tag.includes("water_body") ||
              tag === "water"
            ) {
              material.transparent = true;
              material.opacity = 0.22;
              material.depthWrite = false;
              material.side = THREE.DoubleSide;
              material.needsUpdate = true;
            }

            return material;
          });

          object.material = Array.isArray(object.material)
            ? fixedMaterials
            : fixedMaterials[0];
        });

        /*
          自動把模型置中。
          不需要再手動猜 position。
        */
        root.updateWorldMatrix(true, true);

        const box = new THREE.Box3();
        let hasGeometry = false;

        root.traverse((object) => {
          if (
            !object.visible ||
            !object.isMesh ||
            !object.geometry
          ) {
            return;
          }

          if (!object.geometry.boundingBox) {
            object.geometry.computeBoundingBox();
          }

          if (!object.geometry.boundingBox) return;

          const partBox =
            object.geometry.boundingBox
              .clone()
              .applyMatrix4(object.matrixWorld);

          if (!hasGeometry) {
            box.copy(partBox);
            hasGeometry = true;
          } else {
            box.union(partBox);
          }
        });

        if (hasGeometry) {
          const centerWorld =
            box.getCenter(new THREE.Vector3());

          const size =
            box.getSize(new THREE.Vector3());

          /*
            把世界中心換成 root 父層的局部座標，
            再將 glTF root 移至 entity 原點。
          */
          const centerLocal =
            root.parent.worldToLocal(
              centerWorld.clone()
            );

          root.position.sub(centerLocal);

          /*
            依 MindAR 圖卡寬度=1 自動縮放：
            水槽約佔圖卡寬 78%、高 58%。
          */
          const widthScale =
            0.78 / Math.max(size.x, 0.001);

          const heightScale =
            0.58 / Math.max(size.y, 0.001);

          const fitScale =
            clamp(
              Math.min(widthScale, heightScale),
              0.03,
              0.30
            );

          modelEl.object3D.scale.setScalar(fitScale);
        } else {
          /* 極端情況下的安全備援 */
          modelEl.object3D.scale.setScalar(0.12);
        }

        resetView();

        console.log("Stem rigs:", stemRigs.length);
      }

      modelEl.addEventListener("model-loaded", () => {
        modelReady = true;

        prepareModel();
        startPlantAnimation();

        startButton.disabled = false;
        startButton.textContent = "開始 AR";
      });

      modelEl.addEventListener("model-error", (event) => {
        console.error("GLB model error:", event);

        startButton.disabled = true;
        startButton.textContent = "3D 模型載入失敗";

        showError(
          "3D 模型無法載入。請確認 submerged_plant_tank_final.glb、targets.mind 與 index.html 位於 GitHub Repository 同一層。"
        );
      });

      /* ------------------------------
         啟動 MindAR
      ------------------------------ */

      startButton.addEventListener("click", () => {
        hideError();

        startButton.disabled = true;
        startButton.textContent = "正在啟動相機…";

        if (!arSystem) {
          arSystem = scene.systems["mindar-image-system"];
        }

        if (!arSystem) {
          startButton.disabled = false;
          startButton.textContent = "重新嘗試";

          showError(
            "MindAR 尚未初始化完成。請重新整理頁面後再試。"
          );
          return;
        }

        statusBox.style.display = "block";
        statusBox.textContent = "正在啟動相機……";

        try {
          arSystem.start();
        } catch (error) {
          console.error("MindAR start error:", error);

          startButton.disabled = false;
          startButton.textContent = "重新嘗試";

          showError(
            "AR 啟動失敗：" +
            (error.message || "未知錯誤")
          );
        }
      });

      scene.addEventListener("arReady", () => {
        arReady = true;

        forceCameraVideoVisible();

        startScreen.style.display = "none";
        statusBox.style.display = "block";
        statusBox.textContent =
          "相機已啟動！請將鏡頭對準完整圖卡。";
      });

      scene.addEventListener("arError", (event) => {
        console.error("MindAR arError:", event);

        arReady = false;

        startScreen.style.display = "flex";
        startButton.disabled = false;
        startButton.textContent = "重新嘗試";
        statusBox.style.display = "none";

        showError(
          "相機權限已允許，但 AR 無法初始化。請重新整理頁面後再試。"
        );
      });

      /*
        iPhone Safari：保留已成功的 video 顯示修正。
      */
      function forceCameraVideoVisible() {
        let attempts = 0;

        const timer = setInterval(() => {
          attempts += 1;

          const videos =
            document.querySelectorAll("video");

          videos.forEach((video) => {
            video.setAttribute("playsinline", "");
            video.setAttribute("webkit-playsinline", "");
            video.setAttribute("autoplay", "");
            video.muted = true;

            video.style.position = "fixed";
            video.style.inset = "0";
            video.style.width = "100vw";
            video.style.height = "100vh";
            video.style.objectFit = "cover";
            video.style.display = "block";
            video.style.visibility = "visible";
            video.style.opacity = "1";
            video.style.zIndex = "0";

            const promise = video.play();

            if (
              promise &&
              typeof promise.catch === "function"
            ) {
              promise.catch(() => {});
            }
          });

          if (attempts >= 20) {
            clearInterval(timer);
          }
        }, 250);
      }

      /* ------------------------------
         圖卡辨識
      ------------------------------ */

      target.addEventListener("targetFound", () => {
        targetVisible = true;

        statusBox.textContent =
          "✅ 已辨識圖卡！可旋轉模型並調整水流。";

        if (modelReady) {
          controlPanel.style.display = "block";
          gestureHint.style.display = "block";
        }
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;

        statusBox.textContent =
          "請將鏡頭重新對準完整圖卡。";

        controlPanel.style.display = "none";
        gestureHint.style.display = "none";
      });

      /* ------------------------------
         旋轉 / 縮放手勢
      ------------------------------ */

      document.addEventListener(
        "touchstart",
        (event) => {
          if (
            !targetVisible ||
            isUIElement(event.target)
          ) {
            return;
          }

          if (event.touches.length === 1) {
            lastTouchX = event.touches[0].clientX;
            lastTouchY = event.touches[0].clientY;
          }

          if (event.touches.length === 2) {
            lastPinchDistance =
              touchDistance(
                event.touches[0],
                event.touches[1]
              );

            pinchStartScale = userScale;
          }
        },
        { passive: false }
      );

      document.addEventListener(
        "touchmove",
        (event) => {
          if (
            !targetVisible ||
            isUIElement(event.target)
          ) {
            return;
          }

          if (event.touches.length === 1) {
            event.preventDefault();

            const x = event.touches[0].clientX;
            const y = event.touches[0].clientY;

            const dx = x - lastTouchX;
            const dy = y - lastTouchY;

            yaw += dx * 0.35;
            pitch += dy * 0.25;

            pitch = clamp(pitch, -45, 45);

            lastTouchX = x;
            lastTouchY = y;

            setPivotTransform();
          }

          if (
            event.touches.length === 2 &&
            lastPinchDistance > 0
          ) {
            event.preventDefault();

            const distance =
              touchDistance(
                event.touches[0],
                event.touches[1]
              );

            const ratio =
              distance / lastPinchDistance;

            userScale =
              clamp(
                pinchStartScale * ratio,
                0.65,
                1.65
              );

            setPivotTransform();
          }
        },
        { passive: false }
      );

      document.addEventListener(
        "touchend",
        () => {
          lastPinchDistance = 0;
        },
        { passive: true }
      );

      resetButton.addEventListener(
        "click",
        resetView
      );

      /* 桌機測試也可以滑鼠旋轉 */
      let mouseDragging = false;
      let mouseX = 0;
      let mouseY = 0;

      document.addEventListener("pointerdown", (event) => {
        if (
          event.pointerType !== "mouse" ||
          !targetVisible ||
          isUIElement(event.target)
        ) {
          return;
        }

        mouseDragging = true;
        mouseX = event.clientX;
        mouseY = event.clientY;
      });

      document.addEventListener("pointermove", (event) => {
        if (!mouseDragging) return;

        const dx = event.clientX - mouseX;
        const dy = event.clientY - mouseY;

        yaw += dx * 0.35;
        pitch =
          clamp(
            pitch + dy * 0.25,
            -45,
            45
          );

        mouseX = event.clientX;
        mouseY = event.clientY;

        setPivotTransform();
      });

      document.addEventListener("pointerup", () => {
        mouseDragging = false;
      });

      /* ------------------------------
         水流控制
      ------------------------------ */

      flowSlider.addEventListener("input", (event) => {
        flowStrength =
          Number(event.target.value);

        updateFlowLabel();
      });

      function updateFlowLabel() {
        if (flowStrength === 0) {
          flowValue.textContent = "無水流";
        } else if (flowStrength < 35) {
          flowValue.textContent = "微弱";
        } else if (flowStrength < 70) {
          flowValue.textContent = "中等";
        } else {
          flowValue.textContent = "強";
        }
      }

      function startPlantAnimation() {
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
        }

        function animate(now) {
          const time =
            (now - animationStart) / 1000;

          const normalized =
            flowStrength / 100;

          const baseTilt =
            normalized *
            THREE.MathUtils.degToRad(15);

          const swayAmount =
            normalized *
            THREE.MathUtils.degToRad(7);

          stemRigs.forEach((stem) => {
            const wave =
              Math.sin(
                time *
                (1.1 + normalized * 1.5) +
                stem.phase
              );

            stem.object.rotation.z =
              stem.baseZ -
              baseTilt * stem.swayFactor +
              wave *
              swayAmount *
              stem.swayFactor;

            stem.object.rotation.x =
              stem.baseX +
              wave *
              swayAmount *
              0.28;
          });

          animationFrame =
            requestAnimationFrame(animate);
        }

        animationFrame =
          requestAnimationFrame(animate);
      }

      updateFlowLabel();
      resetView();
    });
  </script>
